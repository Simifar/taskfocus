name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality-and-build:
    name: Quality and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Build-time placeholders only. No database service or real credentials are used.
      DATABASE_URL: postgresql://taskfocus:taskfocus@127.0.0.1:5432/taskfocus_ci?schema=public
      NEXTAUTH_SECRET: ci-placeholder-do-not-use-outside-build
      NEXTAUTH_URL: http://localhost:3000
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Run existing quality checks
        run: npm run check

      - name: Build for production
        run: npm run build
